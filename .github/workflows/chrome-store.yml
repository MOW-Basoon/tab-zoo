name: Chrome Web Store package

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "package = build only, status = verify the store connection, submit = upload and request review"
        type: choice
        required: true
        default: package
        options: [package, status, submit]

concurrency:
  group: tab-zoo-chrome-store
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm test
      - name: Build store ZIP
        shell: pwsh
        run: ./scripts/package-extension.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: outputs/tab-zoo-extension-*.zip
          archive: false
          if-no-files-found: error
          retention-days: 3
      - name: Sign in to the Chrome Web Store
        if: inputs.operation != 'package'
        id: store
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/600317457896/locations/global/workloadIdentityPools/github/providers/store
          service_account: store-release@mow-tab-zoo-release.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: ${{ inputs.operation == 'status' && 'https://www.googleapis.com/auth/chromewebstore.readonly' || 'https://www.googleapis.com/auth/chromewebstore' }}
          create_credentials_file: false
      - name: Check status or submit package
        if: inputs.operation != 'package'
        env:
          CWS_TOKEN: ${{ steps.store.outputs.access_token }}
          OPERATION: ${{ inputs.operation }}
        run: node scripts/chrome-store-release.mjs
